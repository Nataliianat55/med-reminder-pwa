<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F2F2F7" />
    <title>Офлайн</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
        background: #f2f2f7;
        color: #0b0b0f;
      }
      .wrap {
        max-width: 420px;
        margin: 0 auto;
        padding: 20px;
      }
      .card {
        background: #fff;
        border-radius: 24px;
        padding: 18px;
        box-shadow: 0 8px 24px rgba(17, 24, 39, 0.08);
        border: 1px solid rgba(0, 0, 0, 0.06);
      }
      .sub {
        color: #6b7280;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Немає мережі</h1>
      <div class="card">
        <div>Додаток працює офлайн, але ця сторінка ще не в кеші.</div>
        <div class="sub">Повернись назад або відкрий головний екран.</div>
      </div>
    </div>
  </body>
</html>
